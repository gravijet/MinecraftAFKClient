[package]
name = "afk"
version = "2.6.1"
edition = "2021"
description = "AFKSystems – schlanker Minecraft-AFK-Client für MC 1.21.1, 1.21.11, 26.1 und 26.2"

[[bin]]
name = "afk"
path = "src/main.rs"

# Bauformen aus derselben Quelle. Was eine Bauform nicht kann, ist in ihr auch nicht
# einkompiliert – weder der Code noch die Zustandstabellen. Die Skripte bauen jede Variante in ein
# eigenes Zielverzeichnis, damit sie sich nicht gegenseitig überschreiben
# (siehe build-all.ps1 / build-all.sh, Dateinamen in RELEASE.md).
#
#   (ohne)              schlanker AFK-Client – kein Byte darüber hinaus
#   --features movement   zusätzlich :go/:look/:home/:route
#   --features items      zusätzlich Menüs samt Feldinhalten (Name, Farben, Lore)
#   --features pov-client Live-Ansicht samt Browser-HUD, Menues und Gegenstaenden
#   --features premium    zusätzlich Anzeigetafel, Menüs, Anti-AFK, Schleichen
#   --features premium,items   Premium plus Feldinhalte
#   --features ultra      alles zusammen
[features]
default = []

# --- Einzelteile ---------------------------------------------------------------------------
# Örtliche ':'-Befehle überhaupt (Eingabeschleife, :help, :pos).
local = []
movement = ["local"]
# Gemeinsame Zusatz-Paket-IDs aller Ausbaustufen (proto::Extra).
extras = ["local"]
# Anzeigetafel (Seitenleiste).
board = ["extras"]
# Behälter/Menüs öffnen, anklicken, schließen.
menu = ["extras"]
# Feldinhalte lesen: Name, Farbformatierung, Lore.
items = ["menu"]
# Tastenzustand: Schleichen, Sprinten, Arm, Rechtsklick, Schnellleiste.
state = ["extras"]
# Automatische kleine Bewegung – braucht sb_swing (state) und das Bewegungspaket.
antiafk = ["movement", "state"]
# Live-Ansicht: Chunks lesen und als Bild zeichnen.
pov = ["extras", "dep:png", "dep:zip"]
# Eigene POV-Datei: startet die Ansicht nach dem Beitritt automatisch. Ultra enthält zwar den
# POV-Code, startet ihn aber nur auf Wunsch mit `:pov live`.
pov-client = ["pov", "items", "state"]

# --- Fertige Bauformen ---------------------------------------------------------------------
premium = ["movement", "board", "menu", "state", "antiafk"]
ultra = ["premium", "items", "pov"]

[dependencies]
# HTTPS nur für Login/Token-Refresh und den Sitzungs-Join (kurze Bursts, danach wieder frei).
# Der TLS-Anbieter wird pro Zielplattform gewählt (siehe [target...] weiter unten):
#   Windows      -> native-tls = SChannel: kein C-Compiler, keine Wurzelzertifikate im Binary
#   Linux/macOS  -> rustls:     kein OpenSSL und keine libssl-dev nötig, statisch linkbar (musl)
ureq = { version = "2", default-features = false, features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Paket-Kompression (zlib) – reine Rust-Implementierung, kein C.
flate2 = "1"
# AES-128 als Blockchiffre; CFB8 ist in conn.rs von Hand implementiert (spart eine Abhängigkeit).
aes = "0.8"
# RSA/PKCS1v15 für das Verschlüsselungs-Handshake mit dem Server.
rsa = "0.9"
sha1 = "0.10"
rand = "0.8"
base64 = "0.22"
# Nur um beim Anlegen eines NEUEN Kontos ein deviceKeyPair zu erzeugen, das der Java-Client lesen kann.
p256 = { version = "0.13", features = ["pkcs8"] }
# Die Browser-POV decodiert die PNGs aus der Original-Client-JAR und schreibt ihre Frames als
# PNG. Beides bleibt auf POV/Ultra beschraenkt; die schlanke Binary zieht die Abhaengigkeiten
# nicht mit.
png = { version = "0.17", optional = true }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"], optional = true }

[target.'cfg(windows)'.dependencies]
# TLS über SChannel (im System vorhanden) – spart den Wurzelzertifikat-Speicher im Binary.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# Nur für SetConsoleOutputCP(UTF-8) – ohne das zerlegt die Windows-Konsole jeden Umlaut.
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[target.'cfg(not(windows))'.dependencies]
# Linux/macOS: rustls statt OpenSSL. Beim Bauen wird dadurch KEIN libssl-dev/pkg-config
# gebraucht, und das Ergebnis ist gegen musl auch vollständig statisch linkbar.
ureq = { version = "2", default-features = false, features = ["tls"] }

# Auf minimalen Fußabdruck getrimmt: kleine Binary, ein Codegen-Unit, kein Unwind-Tabellen-Ballast.
#
# `opt-level = 3` ist hier nachgemessen und wieder verworfen worden – die Vermutung, die heißen
# Schleifen (AES-CFB8 je Byte, Palettenauspacken je Block, Raycaster je Bildpunkt) würden davon
# profitieren, hielt der Messung nicht stand:
#
#           opt-level = "s"        opt-level = 3
#   CFB8    18,6 MB/s              19,0 MB/s
#   64x32    3,1 ms je Bild         4,1 ms je Bild
#   426x240  141 ms je Bild         137 ms je Bild
#   Binary   3,41 MB                4,07 MB   (Ultra-Bauform)
#
# Also innerhalb der Messstreuung gleich schnell und 660 KB größer. Die Schleifen hängen an
# Speicherzugriffen und Sprüngen, nicht an fehlendem Entrollen; wo wirklich Zeit lag, steht es
# jetzt im Code (siehe `Ray::steps_in_section` und `render_pixels`). Wer das erneut ändern will,
# messe bitte vorher mit
#   cargo test --release --features ultra -- --ignored --nocapture messlauf_bildrate
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
