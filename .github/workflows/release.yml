name: Build und latest-Release

# Bei jedem Push auf main: alles bauen und das Release "latest" durch den frischen Stand ersetzen.
# Bewusst nur main - sonst würde ein Push auf irgendeinen Nebenzweig "latest" überschreiben.
# Für einen Testlauf aus einem Zweig heraus: Actions -> diesen Workflow -> "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Ein neuer Push macht einen noch laufenden Build überflüssig.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Kein upload-artifact: Artefakte wären hier nur ein Zwischenlager zwischen den Jobs, kosten aber
# Speicher-Quota (die kontoweit gilt und den Build sonst mitreißt, wenn ein ganz anderes Repo sie
# vollmacht). Stattdessen lädt jeder Job direkt in ein unveröffentlichtes Sammel-Release; erst wenn
# alles gebaut ist, wird daraus "latest". Bricht ein Build ab, bleibt das alte "latest" unangetastet.
env:
  ENTWURF: latest-entwurf

jobs:
  vorbereiten:
    name: Sammel-Release anlegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Entwurf neu anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Reste eines abgebrochenen Laufs weg (Entwürfe haben keinen Tag, daher || true).
          gh release delete "$ENTWURF" --yes --cleanup-tag || true

          # Als Datei statt als Argument: so bleibt die Markdown-Formatierung heil.
          cat > notes.md <<EOF
          Automatisch gebaut aus \`$GITHUB_REF_NAME\` (${GITHUB_SHA:0:7}).

          ## Welche Datei ist welche?

          Die neuen Varianten sind ausschließlich Rust-Clients. Jede Rust-Datei unterstützt
          Minecraft \`1.21.1\`, \`1.21.11\`, \`26.1\` und \`26.2\`; ausgewählt wird mit
          \`--mc <version>\`.

          | Windows | Linux | Enthaltene Funktionen |
          | --- | --- | --- |
          | \`afk-windows.exe\` | \`afk-linux\` | kleiner Basisclient: Verbindung, Chat, Befehle und Makros |
          | \`afk-windows-move.exe\` | \`afk-linux-move\` | Basisclient plus manuelle Bewegung, Blickrichtung, Routen und Sprung/Fall |
          | \`items-afk-windows.exe\` | \`items-afk-linux\` | Basisclient plus Menü-Klicks und sichtbare Menü-/Inventargegenstände mit Anzahl, Name, Farbcodes und Lore |
          | \`premium-afk-windows.exe\` | \`premium-afk-linux\` | Bewegung, formatiertes Scoreboard, Menü-Klicks, Tastenzustand und Anti-AFK; ohne Gegenstandsdaten und POV-Weltspeicher |
          | \`premium-items-afk-windows.exe\` | \`premium-items-afk-linux\` | Premium plus sichtbare Menü- und Inventargegenstände mit Namen, Farben und Lore |
          | \`pov-afk-windows.exe\` | \`pov-afk-linux\` | eigener POV-Client; startet automatisch eine Live-First-Person-Ansicht der geladenen Welt im Terminal |
          | \`ultra-afk-windows.exe\` | \`ultra-afk-linux\` | alle Rust-Funktionen in einer Datei: Premium, Items und mit \`:pov live\` zuschaltbare POV |

          Die vier Java-Dateien bleiben unverändert getrennt nach Protokollversion:
          \`afk-1.21.1.jar\`, \`afk-1.21.11.jar\`, \`afk-26.1.jar\` und \`afk-26.2.jar\`.
          Items-, POV-, Premium-Items- und Ultra-Varianten gibt es bewusst nur für Rust.

          ## Wichtige Änderungen

          - Tablist und Playerlist wurden vollständig aus allen Rust-Varianten entfernt.
          - Nach einem Kick oder Verbindungsabbruch verbindet sich der Client nicht automatisch neu,
            sondern beendet sich mit Fehlerstatus. Nur ein ausdrücklich vom Server angeordneter
            Transfer auf einen Unterserver wird als Teil derselben Sitzung weiter befolgt.
          - Items-Varianten zeigen \`:menu\`, \`:slot <nummer>\` und \`:inv\` mit echten
            versionsabhängigen Vanilla-Namen sowie benutzerdefinierten Namen, \`§\`-Farbcodes und Lore.
          - Premium und Ultra übertragen beim Scoreboard Titel, Anzeigenamen, Teamformatierung und
            Zahlenformate einschließlich farbigem/festem Text oder ausgeblendeten Zahlen.
          - Die POV decodiert live Chunks, Blockänderungen und Entities und raycastet aus der aktuellen
            Kameraposition. Das Minecraft-Protokoll liefert keine fertigen Bildschirmbilder oder
            Texturen; die headless POV ist deshalb eine farbige Voxelansicht im Terminal.

          Die beigefügte [RELEASE.md](https://github.com/${{ github.repository }}/releases/download/latest/RELEASE.md)
          enthält die ausführliche Auswahlhilfe, Bedienbefehle und Startbeispiele. Die vollständige
          Funktionsmatrix steht in [FEATURES.md](https://github.com/${{ github.repository }}/blob/main/FEATURES.md).

          Hilfe: \`afk-windows.exe --help\` bzw. \`java -jar afk-26.1.jar --help\`
          EOF

          gh release create "$ENTWURF" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "AFKSystems – latest" \
            --notes-file notes.md
          gh release upload "$ENTWURF" RELEASE.md --clobber

  java:
    name: Jars (alle vier Minecraft-Versionen)
    needs: vorbereiten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Bauen
        run: |
          chmod +x gradlew
          for v in 1.21.1 1.21.11 26.1 26.2; do
            ./gradlew :java:shadowJar -Pmc=$v --console=plain
          done

      - name: Hochladen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh java/build/libs/afk-*.jar   # bricht ab, wenn nichts gebaut wurde
          gh release upload "$ENTWURF" java/build/libs/afk-*.jar --clobber

  rust:
    name: Binary (${{ matrix.name }})
    needs: vorbereiten
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ''
            platform: linux
          - os: windows-latest
            name: windows
            ext: .exe
            platform: windows
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Bauen
        working-directory: rust
        shell: bash
        run: |
          cargo build --release
          cargo build --release --features movement --target-dir target/movement
          cargo build --release --features items --target-dir target/items
          cargo build --release --features premium --target-dir target/premium
          cargo build --release --features premium,items --target-dir target/premium-items
          cargo build --release --features pov-client --target-dir target/pov
          cargo build --release --features ultra --target-dir target/ultra

      - name: Tests
        working-directory: rust
        run: |
          cargo test --release
          cargo test --release --all-features --target-dir target/tests

      - name: Hochladen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          ext='${{ matrix.ext }}'
          platform='${{ matrix.platform }}'
          cp "rust/target/release/afk$ext" "out/afk-$platform$ext"
          cp "rust/target/movement/release/afk$ext" "out/afk-$platform-move$ext"
          cp "rust/target/items/release/afk$ext" "out/items-afk-$platform$ext"
          cp "rust/target/premium/release/afk$ext" "out/premium-afk-$platform$ext"
          cp "rust/target/premium-items/release/afk$ext" "out/premium-items-afk-$platform$ext"
          cp "rust/target/pov/release/afk$ext" "out/pov-afk-$platform$ext"
          cp "rust/target/ultra/release/afk$ext" "out/ultra-afk-$platform$ext"
          gh release upload "$ENTWURF" out/* --clobber

  veroeffentlichen:
    name: latest-Release ersetzen
    needs: [java, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Aus dem Entwurf wird "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Erst jetzt das alte Release samt Tag weg – bis hierhin blieb es abrufbar.
          gh release delete latest --yes --cleanup-tag || true
          # Umbenennen und veröffentlichen in einem Schritt: GitHub setzt dabei den Tag "latest"
          # auf den gebauten Commit.
          gh release edit "$ENTWURF" --tag latest --draft=false --latest
          gh release view latest --json tagName,assets --jq '{tag: .tagName, dateien: [.assets[].name]}'
