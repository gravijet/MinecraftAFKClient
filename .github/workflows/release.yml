name: Build und latest-Release

# Bei jedem Push auf main: alles bauen und das Release "latest" durch den frischen Stand ersetzen.
# Bewusst nur main - sonst würde ein Push auf irgendeinen Nebenzweig "latest" überschreiben.
# Für einen Testlauf aus einem Zweig heraus: Actions -> diesen Workflow -> "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Ein neuer Push macht einen noch laufenden Build überflüssig.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Kein upload-artifact: Artefakte wären hier nur ein Zwischenlager zwischen den Jobs, kosten aber
# Speicher-Quota (die kontoweit gilt und den Build sonst mitreißt, wenn ein ganz anderes Repo sie
# vollmacht). Stattdessen lädt jeder Job direkt in ein unveröffentlichtes Sammel-Release; erst wenn
# alles gebaut ist, wird daraus "latest". Bricht ein Build ab, bleibt das alte "latest" unangetastet.
env:
  ENTWURF: latest-entwurf

jobs:
  vorbereiten:
    name: Sammel-Release anlegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Entwurf neu anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Reste eines abgebrochenen Laufs weg (Entwürfe haben keinen Tag, daher || true).
          gh release delete "$ENTWURF" --yes --cleanup-tag || true

          # Diese Datei ist zugleich der zusammengefuehrte Changelog. Keine automatisch
          # erzeugte Kopf-/Fusszeile: Der Release-Text muss bytegenau diesem Stand entsprechen.
          gh release create "$ENTWURF" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "AFKSystems – latest" \
            --notes-file .github/release-notes.md
          gh release upload "$ENTWURF" RELEASE.md --clobber

  java:
    name: Jars (alle vier Minecraft-Versionen)
    needs: vorbereiten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Bauen
        run: |
          chmod +x gradlew
          for v in 1.21.1 1.21.11 26.1 26.2; do
            ./gradlew :java:clean :java:test :java:shadowJar -Pmc=$v --console=plain --warning-mode all
          done

      - name: Hochladen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh java/build/libs/afk-*.jar   # bricht ab, wenn nichts gebaut wurde
          gh release upload "$ENTWURF" java/build/libs/afk-*.jar --clobber

  rust:
    name: Binary (${{ matrix.name }})
    needs: vorbereiten
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ''
            platform: linux
          - os: windows-latest
            name: windows
            ext: .exe
            platform: windows
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Bauen
        working-directory: rust
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = linux ]; then
            cargo fmt --all --check
            cargo clippy --locked --all-targets --all-features -- -D warnings
          fi
          mkdir -p ../out
          ext='${{ matrix.ext }}'
          platform='${{ matrix.platform }}'
          cargo build --locked --release
          cp "target/release/afk$ext" "../out/afk-$platform$ext"
          cargo build --locked --release --features movement
          cp "target/release/afk$ext" "../out/afk-$platform-move$ext"
          cargo build --locked --release --features items
          cp "target/release/afk$ext" "../out/items-afk-$platform$ext"
          cargo build --locked --release --features premium
          cp "target/release/afk$ext" "../out/premium-afk-$platform$ext"
          cargo build --locked --release --features premium,items
          cp "target/release/afk$ext" "../out/premium-items-afk-$platform$ext"
          cargo build --locked --release --features pov-client
          cp "target/release/afk$ext" "../out/pov-afk-$platform$ext"
          cargo build --locked --release --features ultra
          cp "target/release/afk$ext" "../out/ultra-afk-$platform$ext"

      - name: Tests
        working-directory: rust
        run: |
          cargo test --locked --release
          cargo test --locked --release --all-features

      - name: Hochladen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(find out -maxdepth 1 -type f | wc -l)" -eq 7
          gh release upload "$ENTWURF" out/* --clobber

  veroeffentlichen:
    name: latest-Release ersetzen
    needs: [java, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Aus dem Entwurf wird "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Erst jetzt das alte Release samt Tag weg – bis hierhin blieb es abrufbar.
          gh release delete latest --yes --cleanup-tag || true
          # Umbenennen und veröffentlichen in einem Schritt: GitHub setzt dabei den Tag "latest"
          # auf den gebauten Commit.
          gh release edit "$ENTWURF" --tag latest --draft=false --latest
          gh release view latest --json tagName,assets --jq '{tag: .tagName, dateien: [.assets[].name]}'
