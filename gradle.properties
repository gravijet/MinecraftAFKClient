# Versionen zentral pflegen.
#
# Die Minecraft-/Protokollversion wird NICHT mehr hier, sondern über die Build-Variante
# gewählt:  ./gradlew shadowJar -Pvariant=26.1 | 1.21.11 | 1.8.9   (siehe build.gradle.kts)
minecraftAuthVersion=5.0.1
adventureVersion=4.25.0
jlineVersion=3.27.1
gsonVersion=2.11.0
slf4jVersion=2.0.13

# Nur für die 1.8.9-Variante: ViaLoader (zieht ViaVersion/ViaBackwards/ViaRewind/ViaLegacy).
# viaNativeMcProtocolLibVersion = native Protokollversion, die dieser ViaLoader unterstützt
# und die intern per Via auf 1.8 heruntergesprochen wird (für den Nutzer unsichtbar).
viaLoaderVersion=3.0.4
viaNativeMcProtocolLibVersion=1.21.11-1

org.gradle.jvmargs=-Xmx1g
